name: lachesis OpenBSD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: actions/checkout@v7
        uses: actions/checkout@v7

      - name: Install dependencies, build, run
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            set -x
            pkg_add ccache cmake ffmpeg git gmake libarchive libass libevdev-openbsd libinput-openbsd libplacebo libxkbcommon mpv ninja sdl3 wayland wayland-protocols
            
          run: |
            set -x

            git config --global --add safe.directory "$PWD"
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig
            CFLAGS="-Werror" ./configure
            ninja -v -C build
            ./build/lachesis -h
