name: lachesis FreeBSD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: actions/checkout@v7
        uses: actions/checkout@v7

      - name: Build, run
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            set -x
            pkg install -y ccache cmake evdev-proto ffmpeg git libarchive libass \
            libevdev libinput libplacebo libxkbcommon mesa-dri mpv ninja pkgconf \
            python3 sdl3 vulkan-headers wayland wayland-protocols xorg-vfbserver

          run: |
            set -ex

            git config --global --add safe.directory "$PWD"
            export PKG_CONFIG_PATH=/usr/local/libdata/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig

            CFLAGS="-Werror" ./configure
            ninja -v -C build
            ./build/lachesis -h

            ffmpeg -y -f lavfi -i testsrc2=size=64x64:rate=1:duration=1 -c:v libx264 /tmp/test.mp4
            SDL_VIDEO_DRIVER=offscreen ./build/lachesis -an -gpu-api vulkan -loglevel debug -vn /tmp/test.mp4
            SDL_VIDEO_DRIVER=offscreen ./build/lachesis -an -gpu-api opengl -loglevel debug -vn /tmp/test.mp4
