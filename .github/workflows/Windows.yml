name: lachesis Windows

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: actions/checkout@v7
        uses: actions/checkout@v7

      - name: Setup ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ucrt64-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ucrt64-ccache-

      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            nasm
            yasm
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-headers
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-libplacebo
            mingw-w64-ucrt-x86_64-x264
            mingw-w64-ucrt-x86_64-x265
            mingw-w64-ucrt-x86_64-xvidcore
            mingw-w64-ucrt-x86_64-aom
            mingw-w64-ucrt-x86_64-dav1d
            mingw-w64-ucrt-x86_64-libvpx
            mingw-w64-ucrt-x86_64-lame
            mingw-w64-ucrt-x86_64-twolame
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-gnutls
            mingw-w64-ucrt-x86_64-fontconfig
            mingw-w64-ucrt-x86_64-fribidi
            mingw-w64-ucrt-x86_64-libass
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-ffmpeg

      - name: Configure ccache
        shell: bash
        run: |
          ccache --version
          ccache --set-config=cache_dir=$HOME/.ccache
          ccache --set-config=max_size=999M
          ccache --set-config=compression=true
          ccache --zero-stats
          mkdir -p $HOME/.ccache

      - name: Build, install, run
        run: |
          set -ex

          export LACHESIS_LEAK_REPORT=1

          CFLAGS="-Werror" ./configure

          ninja -v -C build
          ninja -C build install

          lachesis -h
          lachesis --version

          lachesis.com --version

          ffmpeg -y -f lavfi -i testsrc2=size=64x64:rate=1:duration=1 -c:v libx264 test.mp4
          lachesis.com -an -loglevel debug -vn test.mp4

      - name: Package portable bundle
        run: |
          set -x

          dist=lachesis-windows-x86_64
          rm -fr "$dist"
          mkdir -p "$dist"
          cp build/lachesis.exe build/lachesis.com "$dist/"

          bindir=/ucrt64/bin
          changed=1
          while [ "$changed" = 1 ]; do
            changed=0
            for f in "$dist"/*.exe "$dist"/*.com "$dist"/*.dll; do
              [ -e "$f" ] || continue
              for dll in $(objdump -p "$f" 2>/dev/null | awk '/DLL Name:/ {print $3}'); do
                if [ -f "$bindir/$dll" ] && [ ! -e "$dist/$dll" ]; then
                  cp "$bindir/$dll" "$dist/"
                  changed=1
                fi
              done
            done
          done

      - name: Add license texts to portable bundle
        run: |
          set -x
          export LC_ALL=C

          dist=lachesis-windows-x86_64
          cp LICENSE.* "$dist/"

          lic="$dist/licenses"
          tmp=$(mktemp -d)
          rm -fr "$lic"
          mkdir -p "$lic"
          : > "$tmp/owners"
          for dll in "$dist"/*.dll; do
            if pkg=$(pacman -Qqo "/ucrt64/bin/${dll##*/}"); then
              echo "$pkg ${dll##*/}" >> "$tmp/owners"
            else
              echo "::warning::No MSYS2 package owns ${dll##*/}"
            fi
          done
          sort -o "$tmp/owners" "$tmp/owners"

          cat > "$lic/README.txt" <<EOF
          lachesis's own license texts are the LICENSE.* files next to lachesis.exe,
          and its source is at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA.

          The DLLs are unmodified files from the MSYS2 UCRT64 packages listed below.
          Each package's license texts are in the directory of the same name, and its
          source is at https://repo.msys2.org/mingw/sources/.

          EOF

          names='(copying|copyright|licen[cs]e|notice|patents|unlicense)[^/]*|license\.terms|licenses/[^/]+'
          for pkg in $(cut -d' ' -f1 "$tmp/owners" | uniq); do
            ver=$(pacman -Q "$pkg" | cut -d' ' -f2)
            name=${pkg#mingw-w64-ucrt-x86_64-}
            dest="$lic/$name"
            mkdir -p "$dest"

            pacman -Qlq "$pkg" | grep '^/ucrt64/share/licenses/.*[^/]$' > "$tmp/files" || true
            while read -r f; do
              rel=${f#/ucrt64/share/licenses/}
              rel=${rel#*/}
              mkdir -p "$dest/$(dirname "$rel")"
              cp "$f" "$dest/$rel"
            done < "$tmp/files"

            if [ ! -s "$tmp/files" ]; then
              base=$(sed -n '/^%BASE%$/{n;p;q}' "/var/lib/pacman/local/$pkg-$ver/desc")
              src="$tmp/src"
              rm -fr "$src"
              mkdir -p "$src/x"
              if curl -fsSL --retry 3 --retry-all-errors -o "$src/src.tar.zst" \
                "https://repo.msys2.org/mingw/sources/$base-$ver.src.tar.zst"; then
                tar -xf "$src/src.tar.zst" -C "$src"
              fi
              for a in "$src/$base"/*.tar.{bz2,gz,lz,xz,zst} "$src/$base"/*.tgz; do
                [ -f "$a" ] || continue
                tar -tf "$a" | grep -iE "^(\./)?[^/]+/($names)$" > "$src/members" || true
                [ -s "$src/members" ] || continue
                tar -xf "$a" -C "$src/x" -T "$src/members"
                while read -r m; do
                  rel=${m#./}
                  rel=${rel#*/}
                  mkdir -p "$dest/$(dirname "$rel")"
                  cp "$src/x/$m" "$dest/$rel"
                done < "$src/members"
              done
              # VCS sources are included as bare git repositories.
              for repo in "$src/$base"/*/; do
                [ -f "$repo/HEAD" ] || continue
                n=$(basename "$repo")
                rev=$(sed -n "/^\s*source = .*git+.*$n.*#/{s/.*#[a-z]*=//;s/?.*//;p;q}" "$src/$base/.SRCINFO")
                git --git-dir="$repo" ls-tree -r --name-only "${rev:-HEAD}" | grep -iE "^($names)$" > "$src/members" || true
                while read -r m; do
                  mkdir -p "$dest/$(dirname "$m")"
                  git --git-dir="$repo" show "${rev:-HEAD}:$m" > "$dest/$m"
                done < "$src/members"
              done
            fi

            if [ -z "$(ls -A "$dest")" ]; then
              echo "::warning::No license text found for $pkg"
            fi
            licenses=$(pacman -Qi "$pkg" | sed -n 's/^Licenses *: //p')
            dlls=$(awk -v p="$pkg" '$1 == p {print $2}' "$tmp/owners" | paste -sd ' ')
            echo "$name $ver ($licenses): $dlls" >> "$lic/README.txt"
          done
          rm -fr "$tmp"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lachesis-windows-x86_64
          path: lachesis-windows-x86_64/
          retention-days: 30
